name: auth_screens
description: The screens around signing in for Flutter apps - status screens (booting, signing in, maintenance, an outdated build, a failed or expired session, an unverified e-mail) and the sign-in, sign-up, password-reset and phone forms, with one shared structure and each app's own look.
version: 0.5.2
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  auth_engine:
    git:
      url: https://github.com/arnoutvandervorst/auth_engine.git
      ref: v0.3.4
  flutter_hooks: ^0.21.3+1
  signals_flutter: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
