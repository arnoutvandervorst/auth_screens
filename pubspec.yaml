name: auth_screens
description: The screens around signing in for Flutter apps - the status screens (booting, signing in, maintenance, an outdated build, a failed or expired session, an unverified e-mail) with one shared structure and each app's own look.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
